# doc-align drift check — GitLab CI 範本（內部 OpenAI-compatible LLM）
#
# 四種 LLM runner，以 DOC_ALIGN_LLM_RUNNER 切換：
#   direct（預設）— 不裝任何 agent，script 直接打 chat/completions（llm-check.js）；
#                   只需 BASE_URL／API_KEY／MODEL，最適合內網。
#   agent         — doc-align 內建 agent loop（bin/doc-align.js）：同一組
#                   BASE_URL／API_KEY／MODEL，不裝任何外部 agent，模型透過受限工具
#                   （讀檔／grep／git 唯讀／自家 scripts）自行探索；需 gateway 支援
#                   OpenAI tool calling，呼叫次數多於 direct。
#   opencode      — 裝 opencode 跑完整 agent playbook（可自由探索 code），支援
#                   BASE_URL 自建 gateway 或 PROVIDER 選公開 provider。
#   custom        — 你自己的 harness（任何語言／框架：Python script、LangGraph、
#                   Pydantic AI…）。範本只負責閘門與貼 note，中段執行
#                   DOC_ALIGN_LLM_CUSTOM_CMD，契約：讀 env 的 range／manifest，
#                   寫出 markdown 報告到 $DOC_ALIGN_REPORT。詳見下方「custom 契約」。
#
# 安裝：複製到目標 repo 的 .gitlab/doc-align.yml，並在 .gitlab-ci.yml 加上：
#   include:
#     - local: '.gitlab/doc-align.yml'
#
# 於 GitLab CI/CD Variables（Settings → CI/CD → Variables，勾 Masked）設定：
#   DOC_ALIGN_LLM_API_KEY   — 你選的 provider 的 API key（唯一 secret，中立命名）
#   DOC_ALIGN_LLM_MODEL     — model id
#   DOC_ALIGN_LLM_BASE_URL  — OpenAI-compatible endpoint（含 /v1，例
#                             https://llm.internal/v1）；direct 模式必填。
#                             opencode 模式留空則改用 DOC_ALIGN_LLM_PROVIDER 指定內建
#                             provider（anthropic／openai／google／openrouter…）
#   DOC_ALIGN_LLM_RUNNER    — 選配：direct（預設）／agent／opencode／custom
#   DOC_ALIGN_LLM_CUSTOM_CMD— custom 模式必填：以 sh -c 執行的一行指令，例
#                             `python3 tools/doc_drift.py` 或
#                             `pip install -q -r tools/req.txt && python3 tools/drift.py`
#   DOC_ALIGN_GITLAB_TOKEN  — 具 api scope 的 project access token（發 MR note 用；
#                             CI_JOB_TOKEN 權限不足以建立 note）
#   DOC_ALIGN_REPO_URL      — 選配：doc-align 的 clone URL；內網無法連 GitHub 時
#                             指向內部鏡像（預設 https://github.com/iamyugachang/doc-align）
#
# 行為與 GitHub 版一致：MR 未觸及 watch 範圍零成本跳過；docs/ 有變更先跑零成本
# Mermaid 語法檢查（語法錯誤 fail job——這是 lint，不是 drift 報告）；有觸及才跑
# LLM check，以單一 MR note（upsert）回報 drift；**drift 永不 fail job**。
#
# custom 契約（DOC_ALIGN_LLM_RUNNER=custom）：
#   範本已把 doc-align 工具 clone 好、跑完閘門與 mermaid lint，接著執行
#   `sh -c "$DOC_ALIGN_LLM_CUSTOM_CMD"`（cwd＝目標 repo 根，image node:20；
#   需要 python 等其他 runtime 請在指令內自行安裝或改 image）。可用 env：
#     DOC_ALIGN_DIR      — doc-align 工具目錄（scripts/、scripts/lib/、playbook/）
#     DOC_ALIGN_RANGE    — 本 MR 的 git range（origin/<target>...HEAD）
#     DOC_ALIGN_GATE     — ci-gate.js 的 JSON 輸出路徑（affectedDocs／changedDocs／range）
#     DOC_ALIGN_REPORT   — 你必須寫出的 markdown 報告路徑（report.md）
#     DOC_ALIGN_LLM_*    — 上面設定的 BASE_URL／API_KEY／MODEL 原樣透傳
#   零件可重用：`node $DOC_ALIGN_DIR/scripts/changed-scope.js --range $DOC_ALIGN_RANGE`、
#   `manifest.js read`；prompt 打包／報告格式在 scripts/lib/check-context.js；
#   報告格式建議沿用 playbook/check.md 的「報告格式」段落，MR 上才與 direct 版一致。
#   結束後範本檢查 $DOC_ALIGN_REPORT 存在且非空——空報告視為 harness 錯誤 fail job
#   （這是設定錯誤，不是 drift）；harness 本身若非零結束也會 fail job。

doc-align:
  stage: test
  image: node:20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"
  script:
    - set -e
    - export DOC_ALIGN_DIR="${CI_BUILDS_DIR}/doc-align-tool"
    - git clone --depth 1 "${DOC_ALIGN_REPO_URL:-https://github.com/iamyugachang/doc-align}" "$DOC_ALIGN_DIR"
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    # ── Cheap gate（無 LLM）──
    - node "$DOC_ALIGN_DIR/scripts/ci-gate.js" --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" > gate.json
    - cat gate.json
    - SKIP=$(node -p "JSON.parse(require('fs').readFileSync('gate.json','utf8')).skip")
    - RANGE=$(node -p "JSON.parse(require('fs').readFileSync('gate.json','utf8')).range")
    - CHANGED_DOCS=$(node -p "JSON.parse(require('fs').readFileSync('gate.json','utf8')).changedDocs.join(' ')")
    # ── Mermaid lint on changed docs（無 LLM；語法錯誤要 fail——lint 非 drift）──
    - if [ -n "$CHANGED_DOCS" ]; then node "$DOC_ALIGN_DIR/scripts/mermaid-check.js" $CHANGED_DOCS; fi
    - if [ "$SKIP" = "true" ]; then echo "doc-align: no watched scope touched — skip (zero LLM cost)"; exit 0; fi
    # ── Drift check：direct（預設，無 agent）──
    - |
      if [ "${DOC_ALIGN_LLM_RUNNER:-direct}" = "direct" ]; then
        node "$DOC_ALIGN_DIR/scripts/llm-check.js" --range "$RANGE" --out report.md
      fi
    # ── Drift check：agent（DOC_ALIGN_LLM_RUNNER=agent 時，內建 tool loop，無外部 agent）──
    - |
      if [ "${DOC_ALIGN_LLM_RUNNER:-direct}" = "agent" ]; then
        node "$DOC_ALIGN_DIR/bin/doc-align.js" check --range "$RANGE" --yes --quiet --out report.md
      fi
    # ── Drift check：opencode（DOC_ALIGN_LLM_RUNNER=opencode 時）──
    - |
      if [ "${DOC_ALIGN_LLM_RUNNER:-direct}" = "opencode" ]; then
      curl -fsSL https://opencode.ai/install | bash
      export PATH="$HOME/.opencode/bin:$PATH"
      # opencode 非互動模式會自動拒絕專案目錄外的讀取；doc-align 工具目錄在
      # $DOC_ALIGN_DIR，必須以 permission 明確放行。BASE_URL 有值時同檔再加
      # custom provider（@ai-sdk/openai-compatible 接內部 gateway）。
      node -e '
        const cfg = {
          "$schema": "https://opencode.ai/config.json",
          permission: { external_directory: { [process.env.DOC_ALIGN_DIR + "/**"]: "allow" } },
        };
        if (process.env.DOC_ALIGN_LLM_BASE_URL) cfg.provider = {
          internal: {
            npm: "@ai-sdk/openai-compatible",
            name: "Internal LLM",
            options: {
              baseURL: process.env.DOC_ALIGN_LLM_BASE_URL,
              apiKey: process.env.DOC_ALIGN_LLM_API_KEY,
            },
            models: { [process.env.DOC_ALIGN_LLM_MODEL]: { name: process.env.DOC_ALIGN_LLM_MODEL } },
          },
        };
        require("fs").writeFileSync("opencode.json", JSON.stringify(cfg, null, 2));
      '
      if [ -n "$DOC_ALIGN_LLM_BASE_URL" ]; then
        MODEL_FLAG="internal/$DOC_ALIGN_LLM_MODEL"
      else
        case "$DOC_ALIGN_LLM_PROVIDER" in
          google) export GOOGLE_GENERATIVE_AI_API_KEY="$DOC_ALIGN_LLM_API_KEY" ;;
          *) KEY_ENV="$(echo "$DOC_ALIGN_LLM_PROVIDER" | tr 'a-z-' 'A-Z_')_API_KEY"
             export "$KEY_ENV=$DOC_ALIGN_LLM_API_KEY" ;;
        esac
        MODEL_FLAG="$DOC_ALIGN_LLM_PROVIDER/$DOC_ALIGN_LLM_MODEL"
      fi
      opencode run -m "$MODEL_FLAG" \
        "你是 doc-align 的執行 agent。讀取 $DOC_ALIGN_DIR/playbook/check.md 並完全遵循其步驟；<SCRIPTS> 為 $DOC_ALIGN_DIR/scripts；以 --range $RANGE 執行。輸出只包含 drift 報告本體（markdown），不要任何前後綴。" \
        > report.md
      rm -f opencode.json
      fi
    # ── Drift check：custom（DOC_ALIGN_LLM_RUNNER=custom 時，執行你自己的 harness）──
    - |
      if [ "${DOC_ALIGN_LLM_RUNNER:-direct}" = "custom" ]; then
        : "${DOC_ALIGN_LLM_CUSTOM_CMD:?DOC_ALIGN_LLM_RUNNER=custom requires DOC_ALIGN_LLM_CUSTOM_CMD}"
        export DOC_ALIGN_RANGE="$RANGE" DOC_ALIGN_GATE="$PWD/gate.json" DOC_ALIGN_REPORT="$PWD/report.md"
        sh -c "$DOC_ALIGN_LLM_CUSTOM_CMD"
        [ -s report.md ] || { echo "doc-align: custom harness did not write $DOC_ALIGN_REPORT" >&2; false; }
      fi
    # ── Upsert MR note ──
    - MARKER="<!-- doc-align-report -->"
    - printf '%s\n\n' "$MARKER" > note.md
    - cat report.md >> note.md
    - NOTES_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes"
    - curl -fsS --header "PRIVATE-TOKEN: $DOC_ALIGN_GITLAB_TOKEN" "$NOTES_URL?per_page=100" > notes.json
    - NOTE_ID=$(node -p "(JSON.parse(require('fs').readFileSync('notes.json','utf8')).find(n => n.body.startsWith('<!-- doc-align-report -->')) || {id:''}).id")
    - |
      if [ -n "$NOTE_ID" ]; then
        curl -fsS -X PUT --header "PRIVATE-TOKEN: $DOC_ALIGN_GITLAB_TOKEN" \
          --data-urlencode "body@note.md" "$NOTES_URL/$NOTE_ID" > /dev/null
      else
        curl -fsS -X POST --header "PRIVATE-TOKEN: $DOC_ALIGN_GITLAB_TOKEN" \
          --data-urlencode "body@note.md" "$NOTES_URL" > /dev/null
      fi
    - echo "doc-align report posted to MR !$CI_MERGE_REQUEST_IID"
