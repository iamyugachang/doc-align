# doc-align nightly — GitLab CI 範本：每天台灣午夜驗 default branch、把 handbook＋
# drift 報告發佈到 GitLab Pages（自動 lane：Pages 是討論專案時的 single source of truth）
#
# 安裝：複製到目標 repo 的 .gitlab/doc-align-nightly.yml，.gitlab-ci.yml 加上：
#   include:
#     - local: '.gitlab/doc-align-nightly.yml'
# 然後在 GitLab UI 建 schedule（CI/CD → Schedules → New）：
#   cron `0 0 * * *`、Timezone 選 Asia/Taipei、target branch 選 default branch。
#   （GitLab 的 cron 排程只能在 UI／API 建，yml 裡的 rules 只負責「排程觸發時才跑」。）
#
# CI/CD Variables（與 MR 版 .gitlab/doc-align.yml 同一組，設過就不用再設）：
#   DOC_ALIGN_LLM_BASE_URL／DOC_ALIGN_LLM_API_KEY（Masked）／DOC_ALIGN_LLM_MODEL
#   DOC_ALIGN_REPO_URL — 選配：內網連不到 GitHub 時指向 doc-align 內部鏡像
#   （沒設憑證也能跑：只發佈 handbook，drift 狀態顯示「未設定」）
#
# 行為與 GitHub nightly 版一致：
#   - drift check 走 --incremental（各文件自 last_verified 起算；drift 未經 sync
#     裁決前每晚都會再出現）。schedule variable DOC_ALIGN_NIGHTLY_MODE=full 改走
#     內建 agent loop 全量重驗（需 gateway 支援 tool calling）。
#   - Pages 內容：/（handbook＋provenance＋drift 狀態）、/drift-report.md、
#     /drift.json（shields.io endpoint badge）。
#   - drift 永不 fail job。

pages:
  stage: deploy
  image: node:20
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"   # 手動跑一次也可以（Run pipeline）
  variables:
    GIT_DEPTH: "0"
  script:
    - set -e
    - export DOC_ALIGN_DIR="${CI_BUILDS_DIR}/doc-align-tool"
    - git clone --depth 1 "${DOC_ALIGN_REPO_URL:-https://github.com/iamyugachang/doc-align}" "$DOC_ALIGN_DIR"
    - |
      if [ -z "$DOC_ALIGN_LLM_API_KEY" ]; then
        echo "doc-align: LLM 憑證未設定，跳過 drift check（只發佈 handbook）"
      elif [ "$DOC_ALIGN_NIGHTLY_MODE" = "full" ]; then
        node "$DOC_ALIGN_DIR/bin/doc-align.js" sync --dry-run --full --yes --quiet --out report.md
      else
        node "$DOC_ALIGN_DIR/scripts/llm-check.js" --incremental --out report.md
      fi
    - mkdir -p public
    - |
      if [ -s report.md ]; then
        node "$DOC_ALIGN_DIR/scripts/render-handbook.js" \
          --branch "$CI_COMMIT_REF_NAME" --drift-report report.md --out public/index.html
        cp report.md public/drift-report.md
        if head -c 500 report.md | grep -q "無 drift"; then
          printf '{"schemaVersion":1,"label":"docs drift","message":"ok","color":"brightgreen"}' > public/drift.json
        else
          printf '{"schemaVersion":1,"label":"docs drift","message":"待裁決","color":"orange"}' > public/drift.json
        fi
      else
        node "$DOC_ALIGN_DIR/scripts/render-handbook.js" --branch "$CI_COMMIT_REF_NAME" --out public/index.html
        printf '{"schemaVersion":1,"label":"docs drift","message":"未設定","color":"lightgrey"}' > public/drift.json
      fi
  artifacts:
    paths:
      - public
